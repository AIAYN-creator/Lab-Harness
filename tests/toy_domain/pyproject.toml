# A domain package as someone else would publish it. The tests read its entry points from here,
# so what they prove is what a real package declares. It is also what `labharness new-domain`
# starts from.
[project]
name = "labharness-toy"
version = "0.0.0"
description = "A toy domain: it writes a note."
requires-python = ">=3.11"
dependencies = ["labharness"]

[project.entry-points."labharness.modules"]
toy = "labharness_toy"

[project.entry-points."labharness.figures"]
note = "labharness_toy"

[project.entry-points."labharness.fields"]
toys = "labharness_toy"

[project.entry-points."labharness.commands"]
toys = "labharness_toy.commands"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
