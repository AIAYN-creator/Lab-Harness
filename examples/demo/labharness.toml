# LabHarness manifest: one [[figure]] entry per generated figure.
# `labharness watch` regenerates a figure whenever its script or any of its inputs change.

[[figure]]
output = "figures/atenolol.pdf"
script = "scripts/atenolol.py"
inputs = ["data/atenolol.smi"]

[[figure]]
output = "figures/decay.pdf"
script = "scripts/decay.py"
inputs = ["data/decay.csv"]

[[figure]]
output = "figures/kapp.pdf"
script = "scripts/kapp.py"
inputs = ["data/kapp.csv"]

[[figure]]
output = "figures/mechanism.pdf"
script = "scripts/mechanism.tex"
