# Style of Elsevier journals (elsarticle class).
#
# This file is the single source of truth for how every figure of this document looks.
# Each engine (RDKit, LaTeX/TikZ, Matplotlib) translates these values; no module may
# hard-code a font, a size or a colour.

name = "elsevier"
description = "Elsevier journals (elsarticle class)"

[typography]
# From the catalogue in labharness/style/typefaces.toml; `font = "..."` in the manifest
# chooses another. Latin Modern is the LaTeX default.
typeface = "latin-modern"
base_size_pt = 8.0
small_size_pt = 7.0

[dimensions]
single_column_in = 3.543
double_column_in = 7.48
# Width divided by height, used when a figure does not ask for a size of its own.
aspect_ratio = 1.3333

[structures]
# ACS Document 1996 geometry, the convention ChemDraw ships for ACS submissions.
bond_length_pt = 14.4
line_width_pt = 0.6
wedge_width_pt = 2.0
double_bond_offset = 0.18
hash_spacing_pt = 2.5
# A structure is drawn as large as the room allows: the column width, or width_in=. Bonds grow
# up to this factor over bond_length_pt and never beyond, and a structure is never taller than
# this fraction of its width.
max_bond_scale = 1.3
max_height_ratio = 1.0

[plots]
grid = false
line_width_pt = 0.8
marker_size_pt = 3.0
error_capsize_pt = 2.0
axis_label_format = "{quantity} ({unit})"
# Okabe-Ito, readable with any colour vision deficiency. Black first: most figures are monochrome.
palette = [
  "#000000",
  "#E69F00",
  "#56B4E9",
  "#009E73",
  "#D55E00",
  "#0072B2",
  "#CC79A7",
  "#F0E442",
]

[latex]
preamble = '''
% Elsevier asks for at least 7 pt in figures, 6 pt in sub- and superscripts; figures are 90 mm
% (one column), 140 mm (one and a half) or 190 mm (full width).
'''
