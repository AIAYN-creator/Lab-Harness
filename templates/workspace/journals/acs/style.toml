# Style of American Chemical Society journals (achemso class).
#
# This file is the single source of truth for how every figure of an ACS document looks.
# Each engine (RDKit, LaTeX/TikZ, Matplotlib) translates these values; no module may
# hard-code a font, a size or a colour. Adding a journal means adding a file like this one.

name = "acs"
description = "American Chemical Society journals (achemso class)"

[typography]
# The default typeface for this journal, from the catalogue in labharness/style/typefaces.toml.
# A workspace can choose another with `font = "..."` in its manifest; the sizes stay the
# journal's. Latin Modern is the LaTeX default, so a document never mixes typefaces.
typeface = "latin-modern"
base_size_pt = 8.0
small_size_pt = 7.0

[dimensions]
single_column_in = 3.25
double_column_in = 7.0
# Width divided by height, used when a figure does not ask for a size of its own.
aspect_ratio = 1.3333

[structures]
# ACS Document 1996 geometry, the convention ChemDraw ships for ACS submissions.
bond_length_pt = 14.4
line_width_pt = 0.6
wedge_width_pt = 2.0
double_bond_offset = 0.18
hash_spacing_pt = 2.5
# A structure is drawn as large as the room allows: the column width, or width_in=. Bonds grow
# up to this factor over bond_length_pt and never beyond, and a structure is never taller than
# this fraction of its width.
max_bond_scale = 1.3
max_height_ratio = 1.0

[plots]
grid = false
line_width_pt = 0.8
marker_size_pt = 3.0
error_capsize_pt = 2.0
axis_label_format = "{quantity} ({unit})"
# Okabe-Ito, readable with any colour vision deficiency. Black first: most figures are monochrome.
palette = [
  "#000000",
  "#E69F00",
  "#56B4E9",
  "#009E73",
  "#D55E00",
  "#0072B2",
  "#CC79A7",
  "#F0E442",
]

[latex]
# Appended to the generated document preamble, because it only concerns achemso.
preamble = '''
% achemso loads mciteplus, which initialises its label-width counters at the first
% \bibitem. A document with an empty bibliography never reaches one, and then fails at
% \end{mcitethebibliography} with an undefined control sequence -- which is exactly what
% a freshly created workspace has.
% \gdef, not \providecommand: LaTeX makes \providecommand macros robust, and a robust
% macro does not expand where TeX expects a number.
\makeatletter
\@ifundefined{mcitemaxwidthbibitem}{\gdef\mcitemaxwidthbibitem{0}}{}
\@ifundefined{mcitemaxwidthsubitem}{\gdef\mcitemaxwidthsubitem{0}}{}
\@ifundefined{@mcitecorrectmaxwidthbibitem}{\gdef\@mcitecorrectmaxwidthbibitem{0}}{}
\@ifundefined{@mcitecorrectmaxwidthsubitem}{\gdef\@mcitecorrectmaxwidthsubitem{0}}{}
\makeatother
'''
