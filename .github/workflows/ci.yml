name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          # Windows is the platform LabHarness is developed and demoed on.
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run pytest -m "not latex"

  latex:
    name: latex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Third-party actions are blocked for this repository, so TeX Live comes from apt
      # instead of setup-texlive-action.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lmodern texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended texlive-xetex texlive-luatex texlive-plain-generic texlive-publishers texlive-bibtex-extra poppler-utils
          pdflatex --version | head -1
      - run: uv sync --all-extras
      - run: uv run pytest -m latex

  # LaTeX on the platform the demo runs on. Slower than the Ubuntu job, so it only guards
  # the document and diagram paths, which are the ones a Windows LaTeX install can break.
  latex-windows:
    name: latex-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No Perl on purpose: this is what a Windows user installs, and LabHarness compiles
      # without latexmk (ADR 25).
      - name: Install MiKTeX
        shell: pwsh
        timeout-minutes: 25
        run: |
          # The MiKTeX installer downloads its package set from miktex.org, which sometimes
          # times out (curl code 28). choco reports that as a failure but the step would carry
          # on, so check for pdflatex itself and retry with a pause before giving up.
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          foreach ($attempt in 1..3) {
            choco install miktex --no-progress -y
            if (Test-Path "$bin\pdflatex.exe") { break }
            if ($attempt -eq 3) { throw "MiKTeX did not install after 3 attempts" }
            Write-Host "::warning::MiKTeX install failed (attempt $attempt of 3), retrying in 60 s"
            choco uninstall miktex miktex.install --no-progress -y --force
            Start-Sleep -Seconds 60
          }
          $env:PATH = "$bin;$env:PATH"
          echo "C:\Program Files\MiKTeX\miktex\bin\x64" >> $env:GITHUB_PATH
          initexmf --set-config-value "[MPM]AutoInstall=1"
      # AutoInstall fetches a missing package in the middle of a test, and a slow mirror then
      # fails the test instead of the install. Fetch what the templates and the demo use first,
      # with retries, so a mirror problem shows here, as itself.
      - name: Install the LaTeX packages the templates use
        shell: pwsh
        timeout-minutes: 15
        run: |
          $packages = "achemso", "mciteplus", "natbib", "rsc", "elsarticle", "chemfig", "simplekv", "standalone", "pgf", "siunitx", "booktabs", "threeparttable"
          miktex --admin packages update-package-database
          foreach ($attempt in 1..3) {
            miktex --admin packages install @packages
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "MiKTeX packages did not install after 3 attempts" }
            Write-Host "::warning::MiKTeX packages failed (attempt $attempt of 3), retrying in 30 s"
            Start-Sleep -Seconds 30
          }
      - name: Report the environment
        shell: pwsh
        run: |
          pdflatex --version | Select-Object -First 1
          bibtex --version | Select-Object -First 1
      - run: uv sync --all-extras
      - run: uv run pytest -m latex

  # macOS runs everything, with BasicTeX, and is part of ci-pass like Linux and Windows.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # BasicTeX is about 100 MB against 5 GB for MacTeX, so it gets the packages LabHarness
      # and its templates use on top: the journal classes, chemfig and TikZ, the typeface
      # catalogue, and the table packages.
      - name: Install BasicTeX and poppler
        run: |
          brew install --cask basictex
          brew install poppler
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          export PATH="/Library/TeX/texbin:$PATH"
          sudo tlmgr update --self
          sudo tlmgr install latexmk achemso mciteplus natbib chemfig simplekv pgf standalone \
            xkeyval etoolbox setspace caption float lm tex-gyre newtx newpx fontaxes xstring \
            stix2-type1 stix2-otf libertinus-type1 libertinus-fonts libertinust1math \
            siunitx booktabs threeparttable elsarticle rsc luatex85
      - name: Report the environment
        run: |
          pdflatex --version | head -1
          bibtex --version | head -1
          pdftoppm -v 2>&1 | head -1
      - run: uv sync --all-extras
      - run: uv run pytest

  # Single required check: the ruleset references this name, so it stays stable
  # however the matrix above changes.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [lint, test, latex, latex-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          echo "latex=${{ needs.latex.result }} latex-windows=${{ needs.latex-windows.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.latex.result }}" = "success" ] || exit 1
          [ "${{ needs.latex-windows.result }}" = "success" ] || exit 1
