name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of files and commands that shows the problem.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `labharness doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: LabHarness version
      placeholder: labharness --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
